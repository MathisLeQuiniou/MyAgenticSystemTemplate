# Alembic config. Run from the repo root:
#   alembic -c backend/db/alembic.ini upgrade head
#   alembic -c backend/db/alembic.ini revision --autogenerate -m "add xyz"
# The database URL comes from backend.config (DATABASE_URL), not from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
